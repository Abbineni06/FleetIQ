<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>FleetIQ - QR Code Vehicle History Hub</title>
  <link rel="stylesheet" href="/css/theme.css?v=2.0">
  <link rel="stylesheet" href="/css/layout.css?v=2.0">
  <link rel="stylesheet" href="/css/components.css?v=2.0">
  <script src="https://unpkg.com/lucide@latest"></script>
  <style>
    .qr-card-grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
      gap: 20px;
    }

    .qr-badge-card {
      background: var(--bg-card);
      border: 1px solid var(--border-color);
      border-radius: var(--radius-lg);
      padding: 24px;
      text-align: center;
      box-shadow: var(--shadow-sm);
      transition: all var(--transition-fast);
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: space-between;
    }

    .qr-badge-card:hover {
      border-color: var(--primary-orange);
      box-shadow: var(--shadow-md);
      transform: translateY(-2px);
    }

    .qr-img-wrapper {
      padding: 12px;
      background: #FFFFFF;
      border-radius: var(--radius-md);
      box-shadow: var(--shadow-sm);
      margin: 16px 0;
      border: 1px solid var(--border-color);
    }
  </style>
</head>
<body>
  <div class="app-wrapper">
    <div id="sidebar-container"></div>

    <div class="main-container">
      <div id="header-container" data-title="QR Vehicle History" data-breadcrumb="FleetIQ / Fleet / QR Hub"></div>

      <main class="page-content">
        <!-- Banner -->
        <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:24px;flex-wrap:wrap;gap:16px;">
          <div>
            <h2 style="font-size:1.4rem;font-weight:800;color:var(--text-primary);">QR-Based Digital Vehicle Passports</h2>
            <p style="color:var(--text-secondary);font-size:0.88rem;margin-top:2px;">
              Every vehicle is issued a unique encrypted QR token. Scan with any phone to view the live maintenance log.
            </p>
          </div>

          <button class="btn btn-secondary" onclick="window.print()">
            <i data-lucide="printer" style="width:16px;height:16px;"></i> Print Fleet QR Badges
          </button>
        </div>

        <!-- Grid of QR Cards -->
        <div class="qr-card-grid" id="qr-cards-grid">
          <div style="text-align:center;grid-column:1/-1;padding:40px;color:var(--text-muted);">
            Generating vehicle QR codes...
          </div>
        </div>
      </main>
    </div>
  </div>

  <div id="toast-container"></div>

  <script src="/js/api.js?v=2.0"></script>
  <script src="/js/auth.js?v=2.0"></script>
  <script src="/js/app.js?v=2.0"></script>
  <script src="/js/qr.js?v=2.0"></script>
</body>
</html>
